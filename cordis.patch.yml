# dsh-evolver — one plugin, one sidebar entry, one panel.
#
# The Host half owns the data folder and publishes two prompt sections plus
# the tool surface; the browser half renders the panel.
#
#   dsh plugin --profile web add /home/chengxinyu/dsh-evolver
#
- insert:
    - id: dsh-evolver
      name: dsh-evolver
      inject: [tools, systemPrompt, connection]
      config:
        # 数据目录：留空则用 ~/.dsh/evolver。
        # dataDir: /home/chengxinyu/.dsh/evolver
        # 注入索引的字节预算，默认 2048。
        # indexBytes: 2048

# 全局偏好文档由 DSH 的 AGENTS.md 加载器注入。web 组合默认关掉了这一行，
# 这里把它打开，否则偏好永远进不了 Agent 的上下文。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: false
  config:
    maxBytes: 65536
