<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>自衍中枢</title>
	<link rel="icon" href="/icon.svg">
	<style>
		html, body { margin: 0; height: 100%; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			background: #0f1115;
			color: #e6e8eb;
			overflow: hidden;
		}
		#root { height: 100vh; display: flex; flex-direction: column; min-height: 0; }
		#boot { padding: 24px; font-size: 13px; color: #8b949e; }
	</style>
</head>
<body>
	<div id="root"><div id="boot">正在加载…</div></div>
	<script src="/react.js"></script>
	<script src="/react-dom.js"></script>
	<script src="/shim.js"></script>
	<script src="/client.js"></script>
	<script>
		// The panel registers during `apply`; mount once the scripts above ran.
		(function () {
			var root = document.getElementById('root')
			try {
				root.innerHTML = ''
				window.__mountZiyan(root)
			} catch (error) {
				root.innerHTML = '<pre style="padding:24px;color:#f85149;white-space:pre-wrap">启动失败：' +
					String(error && error.stack ? error.stack : error).replace(/[<>&]/g, '') + '</pre>'
			}
		})()
	</script>
</body>
</html>
